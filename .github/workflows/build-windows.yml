name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.21.0
      - name: Build EXE
        shell: pwsh
        run: pyinstaller --noconfirm --clean "每周提现工具.spec"
      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "发布包/每周钱包流水" | Out-Null
          Copy-Item "dist/每周提现工具.exe" "发布包/每周提现工具.exe"
          Copy-Item "飞书配置.json" "发布包/飞书配置.json"
          Copy-Item "Windows使用说明.md" "发布包/Windows使用说明.md"
          Set-Content -Encoding UTF8 "发布包/每周钱包流水/请把流水放在这里.txt" "请把 BigSeller 钱包流水放在这里。"
      - uses: actions/upload-artifact@v4
        with:
          name: Windows提现工具-正式版
          path: 发布包
          if-no-files-found: error
          retention-days: 30
